<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AdSales Hub — Paramount</title>
<style>
:root {
  /* ── Paramount Official Brand Colors ── */
  /* Primary palette */
  --vista-navy:   #000a3c;   /* Vista Navy   PMS 2768c */
  --peak-blue:    #0064ff;   /* Peak Blue    PMS 285c  */
  --snowcap:      #ffffff;   /* Snowcap White          */
  --mountain-grey:#d9dae2;   /* Mountain Grey PMS 5315c */

  /* Secondary palette (accents) */
  --horizon:      #ff008a;   /* Horizon      Rhodamine Red */
  --sunrise:      #ffa600;   /* Sunrise      PMS 1235c */
  --sky:          #03d1e5;   /* Sky          PMS 3115c */

  /* Aliases for app use */
  --navy:         var(--vista-navy);
  --navy-light:   #0a1460;
  --blue:         var(--peak-blue);
  --blue-light:   #99c0ff;
  --pink:         var(--horizon);
  --gold:         var(--sunrise);
  --cyan:         var(--sky);
  --gray:         var(--mountain-grey);
  --white:        var(--snowcap);
  --surface:      #f2f3f7;
  --surface-2:    #e8eaf2;
  --border:       rgba(0,100,255,0.1);
  --border-strong:rgba(0,100,255,0.22);
  --text-primary: #000a3c;
  --text-secondary:#3a4170;
  --text-muted:   #7a80a8;

  --sidebar-w: 220px;
  --topbar-h:  60px;
  --radius:    10px;
  --radius-lg: 14px;

  /* ── Paramount Official Typefaces ── */
  /* Vista Sans Condensed/Semi-Condensed for headlines (fallback: Arial Narrow) */
  /* Peak Sans for body (fallback: Arial) */
  --font:           'Peak Sans', 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
  --font-condensed: 'Vista Sans', 'Arial Narrow', 'Arial', sans-serif;
}
  --navy: #000A3C;
  --navy-mid: #001060;
  --navy-light: #0A1A6B;
  --blue: #005FFF;
  --blue-light: #98BFFF;
  --pink: #FF008A;
  --gold: #FFD300;
  --cyan: #02D0E5;
  --gray: #C1BEC1;
  --white: #ffffff;
  --surface: #f4f6fb;
  --border: rgba(0,95,255,0.12);
  --border-strong: rgba(0,95,255,0.25);
  --text-primary: #0a0e2a;
  --text-secondary: #4a5178;
  --text-muted: #8a90b0;
  --sidebar-w: 220px;
  --topbar-h: 60px;
  --radius: 10px;
  --radius-lg: 14px;
  --font: 'Arial', 'Helvetica Neue', Helvetica, sans-serif;
  --font-condensed: 'Arial Black', 'Arial Bold', Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: var(--font); background: var(--surface); color: var(--text-primary); font-size: 14px; }

/* ─── LAYOUT ─────────────────── */
.layout { display: flex; height: 100vh; overflow: hidden; }

/* ─── SIDEBAR ─────────────────── */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--navy);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  overflow-x: hidden;
  border-right: 1px solid rgba(152,191,255,0.08);
}

.sidebar-brand {
  padding: 16px 14px 14px;
  border-bottom: 1px solid rgba(152,191,255,0.1);
  flex-shrink: 0;
}
.brand-logo svg { width: 130px; height: auto; display: block; margin-bottom: 12px; }

.hub-label {
  display: block;
  font-family: var(--font-condensed);
  font-weight: 900;
  font-size: 17px;
  letter-spacing: 3px;
  color: var(--white);
  line-height: 1.1;
}
.hub-sub {
  display: block;
  font-size: 10px;
  color: var(--blue-light);
  letter-spacing: 0.3px;
  margin-top: 2px;
  opacity: 0.8;
}

.sidebar-nav { padding: 14px 8px; flex: 1; }

.nav-section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(152,191,255,0.35);
  padding: 0 8px;
  margin-bottom: 5px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border-radius: 7px;
  cursor: pointer;
  color: rgba(255,255,255,0.55);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.15s;
  margin-bottom: 1px;
  user-select: none;
  white-space: nowrap;
}
.nav-item:hover { background: rgba(0,95,255,0.18); color: var(--white); }
.nav-item.active { background: var(--peak-blue); color: var(--white); box-shadow: 0 2px 10px rgba(0,95,255,0.35); }
.nav-icon { width: 16px; height: 16px; flex-shrink: 0; }

.nav-sub-group {
  margin: 2px 0 4px 25px;
  border-left: 1px solid rgba(152,191,255,0.15);
  padding-left: 10px;
  display: none;
}
.nav-sub-group.open { display: block; }
.nav-sub-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  color: rgba(255,255,255,0.4);
  text-decoration: none;
  font-size: 12px;
  font-weight: 500;
  transition: all 0.15s;
  margin-bottom: 1px;
  user-select: none;
}
.nav-sub-item:hover { color: rgba(255,255,255,0.85); background: rgba(0,95,255,0.1); }
.nav-sub-item.active { color: var(--blue-light); }
.nav-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; opacity: 0.7; }

.sidebar-footer {
  padding: 10px 12px 14px;
  border-top: 1px solid rgba(152,191,255,0.08);
  flex-shrink: 0;
}
.last-update-box { background: rgba(0,95,255,0.12); border-radius: 7px; padding: 9px 11px; }
.last-update-label { font-size: 10px; color: var(--blue-light); opacity: 0.7; letter-spacing: 0.3px; margin-bottom: 2px; }
.last-update-time { font-size: 11px; font-weight: 700; color: var(--white); }

/* ─── MAIN ─────────────────── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

.topbar {
  height: var(--topbar-h);
  background: var(--white);
  border-bottom: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  flex-shrink: 0;
  gap: 16px;
}
.topbar-left { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.page-title { font-family: var(--font-condensed); font-size: 19px; font-weight: 900; letter-spacing: 0.5px; color: var(--navy); line-height: 1; white-space: nowrap; }
.page-breadcrumb { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.update-info { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); white-space: nowrap; }

.refresh-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 15px;
  background: var(--navy); color: var(--white);
  border: none; border-radius: 7px;
  font-family: var(--font); font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
  letter-spacing: 0.2px;
}
.refresh-btn:hover { background: var(--peak-blue); }
.refresh-btn:active { transform: scale(0.97); }
.refresh-btn.loading { opacity: 0.7; pointer-events: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinning { animation: spin 0.8s linear infinite; }

.content { flex: 1; overflow-y: auto; padding: 22px; }

/* ─── COMPONENTS ─────────────────── */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}
.metric-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.metric-card .label { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
.metric-card .value { font-family: var(--font-condensed); font-size: 24px; font-weight: 900; color: var(--vista-navy); line-height: 1; margin-bottom: 3px; }
.metric-card .delta { font-size: 11px; font-weight: 500; }
.delta-up { color: #0a7a40; }
.delta-down { color: #c0392b; }
.delta-neutral { color: var(--text-muted); }

.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.chart-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
}
.chart-card.full { grid-column: 1 / -1; }
.chart-card .chart-title { font-family: var(--font-condensed); font-size: 13px; font-weight: 900; letter-spacing: 0.3px; color: var(--vista-navy); margin-bottom: 3px; text-transform: uppercase; }
.chart-card .chart-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; }

.legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; font-size: 11px; color: var(--text-secondary); }
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex-shrink: 0; }

.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; margin-top: 6px; }
.section-title { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }

.tipo-tabs { display: flex; gap: 7px; margin-bottom: 18px; flex-wrap: wrap; }
.tipo-tab {
  font-family: var(--font-condensed);
  font-size: 12px; font-weight: 900; letter-spacing: 1.5px;
  padding: 6px 16px; border-radius: 20px;
  border: 1px solid var(--border-strong);
  cursor: pointer; color: var(--text-secondary);
  background: var(--white); transition: all 0.15s; user-select: none;
}
.tipo-tab:hover { border-color: var(--blue); color: var(--blue); }
.tipo-tab.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

.plat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(195px, 1fr)); gap: 11px; margin-bottom: 18px; }
.plat-card {
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 14px 16px;
  transition: all 0.15s; position: relative; overflow: hidden;
}
.plat-card::before { content:''; position:absolute; top:0;left:0;right:0; height:3px; background:var(--blue); opacity:0; transition:opacity .15s; }
.plat-card:hover { border-color: var(--border-strong); }
.plat-card:hover::before, .plat-card.featured::before { opacity:1; }
.plat-card.featured { border-color: rgba(0,95,255,0.3); }

.plat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.plat-name { font-family: var(--font-condensed); font-size: 15px; font-weight: 900; color: var(--navy); }
.plat-badge { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; padding: 2px 7px; border-radius: 4px; }
.plat-stat { display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0; border-bottom: 1px solid var(--border); }
.plat-stat:last-of-type { border-bottom: none; }
.plat-stat-label { color: var(--text-muted); }
.plat-stat-val { font-weight: 700; color: var(--text-primary); }
.plat-note { font-size: 10px; color: var(--text-muted); line-height: 1.5; margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--border); }

.tipo-banner {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
  border-radius: var(--radius-lg); padding: 16px 20px; margin-bottom: 18px;
  display: flex; align-items: flex-start; gap: 14px;
}
.tipo-banner-badge {
  font-family: var(--font-condensed); font-size: 20px; font-weight: 900;
  letter-spacing: 2px; color: var(--white); background: var(--blue);
  padding: 7px 14px; border-radius: 7px; flex-shrink: 0; line-height: 1;
}
.tipo-banner-title { font-family: var(--font-condensed); font-size: 14px; font-weight: 900; letter-spacing: 0.8px; color: var(--blue-light); margin-bottom: 4px; text-transform: uppercase; }
.tipo-banner-desc { font-size: 12px; color: rgba(255,255,255,0.68); line-height: 1.55; }

.trend-up { color: #1a7a3c; } .trend-down { color: #c0392b; } .trend-stable { color: var(--text-muted); }

.page-intro {
  background: var(--navy); border-radius: var(--radius-lg);
  padding: 18px 22px; margin-bottom: 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
}
.page-intro-text h2 { font-family: var(--font-condensed); font-size: 18px; font-weight: 900; letter-spacing: 0.5px; color: var(--white); margin-bottom: 3px; }
.page-intro-text p { font-size: 12px; color: rgba(152,191,255,0.78); line-height: 1.5; }
.page-intro-stat { text-align: right; flex-shrink: 0; }
.page-intro-stat .big { font-family: var(--font-condensed); font-size: 32px; font-weight: 900; color: var(--white); line-height: 1; }
.page-intro-stat .small { font-size: 10px; color: var(--blue-light); margin-top: 2px; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

@media (max-width: 900px) {
  .charts-row { grid-template-columns: 1fr; }
  .chart-card.full { grid-column: auto; }
}

</style>
</head>

<script>

// Polyfill: roundRect → rect fallback for older Chrome
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    this.rect(x, y, w, h);
    return this;
  };
}

// MiniChart — lightweight Chart.js-compatible canvas renderer
// Supports: bar (incl. horizontal indexAxis:'y', stacked), line, doughnut
// MiniChart direct global
(function() {
const global = window;
'use strict';
const PR = 1; // pixel ratio

function hexAlpha(hex, a){ // apply opacity to hex color string like #aabbcc or #aabbccdd
  const h = hex.replace('#','');
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
function colorAlpha(c, a){ // handle rgba() or hex
  if(!c) return `rgba(0,0,0,${a})`;
  if(c.startsWith('rgba')) return c.replace(/[\d.]+\)$/,`${a})`);
  if(c.startsWith('rgb(')) return c.replace('rgb(','rgba(').replace(')',`,${a})`);
  if(c.startsWith('#')) return hexAlpha(c,a);
  return c;
}

function getCanvas(id){ return typeof id==='string' ? document.getElementById(id) : id; }

function setupCanvas(canvas){
  const parent = canvas.parentElement;
  const w = (parent && parent.clientWidth > 10) ? parent.clientWidth : 400;
  const h = (parent && parent.clientHeight > 10) ? parent.clientHeight : 250;
  canvas.width = w; canvas.height = h;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  return canvas.getContext('2d');
}

const PAD = {top:16, right:16, bottom:36, left:56};

function Chart(canvasOrId, config){
  this.canvas = getCanvas(canvasOrId);
  this.config = config;
  this._draw();
}
Chart.prototype.destroy = function(){ 
  if(this.canvas){ const ctx=this.canvas.getContext('2d'); ctx.clearRect(0,0,this.canvas.width,this.canvas.height); }
};
Chart.prototype._draw = function(){
  const cfg = this.config;
  const type = cfg.type;
  if(type==='bar') this._drawBar();
  else if(type==='line') this._drawLine();
  else if(type==='doughnut') this._drawDoughnut();
};

// ── BAR ──────────────────────────────────────────────────────────────────────
Chart.prototype._drawBar = function(){
  const cfg = this.config;
  const opts = cfg.options||{};
  const horiz = opts.indexAxis === 'y';
  const stacked = (opts.scales&&opts.scales.x&&opts.scales.x.stacked)||false;
  const datasets = cfg.data.datasets;
  const labels = cfg.data.labels;

  const ctx = setupCanvas(this.canvas);
  const W = this.canvas.width, H = this.canvas.height;

  // measure labels
  ctx.font = '11px Arial,sans-serif';
  let maxLabelW = 0;
  labels.forEach(l=>{ const m=ctx.measureText(String(l)).width; if(m>maxLabelW) maxLabelW=m; });

  const pad = {
    top: 16,
    right: 16,
    bottom: horiz ? 36 : 48,
    left: horiz ? maxLabelW+10 : 52
  };

  const plotW = W - pad.left - pad.right;
  const plotH = H - pad.top - pad.bottom;

  // compute value range
  const yFmt = (opts.scales&&opts.scales.y&&opts.scales.y.ticks&&opts.scales.y.ticks.callback) || (v=>v);
  const xFmt = (opts.scales&&opts.scales.x&&opts.scales.x.ticks&&opts.scales.x.ticks.callback) || (v=>v);

  let allVals = [];
  if(stacked){
    const sums = labels.map((_,i)=>datasets.reduce((s,d)=>s+(d.data[i]||0),0));
    allVals = sums;
  } else {
    datasets.forEach(d=>d.data.forEach(v=>allVals.push(v)));
  }
  const minCfg = horiz ? (opts.scales&&opts.scales.x&&opts.scales.x.min) : (opts.scales&&opts.scales.y&&opts.scales.y.min);
  const rawMin = Math.min(minCfg!=null?minCfg:0, ...allVals);
  const rawMax = Math.max(...allVals);
  const vMin = rawMin < 0 ? rawMin : (minCfg!=null ? minCfg : 0);
  const vMax = rawMax * 1.08 || 1;
  const vRange = vMax - vMin;

  function toPixel(v){
    return horiz
      ? pad.left + (v - vMin)/vRange * plotW
      : pad.top + plotH - (v - vMin)/vRange * plotH;
  }
  const zeroLine = toPixel(0);

  // grid lines
  ctx.strokeStyle = 'rgba(0,10,60,0.07)';
  ctx.lineWidth = 0.5;
  const ticks = 5;
  for(let i=0;i<=ticks;i++){
    const v = vMin + i/ticks*vRange;
    if(horiz){
      const x = toPixel(v);
      ctx.beginPath(); ctx.moveTo(x,pad.top); ctx.lineTo(x,pad.top+plotH); ctx.stroke();
      ctx.fillStyle='rgba(74,81,120,0.85)'; ctx.font='10px Arial,sans-serif'; ctx.textAlign='center';
      ctx.fillText(xFmt(Math.round(v*10)/10), x, H-pad.bottom+14);
    } else {
      const y = toPixel(v);
      ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(pad.left+plotW,y); ctx.stroke();
      ctx.fillStyle='rgba(74,81,120,0.85)'; ctx.font='10px Arial,sans-serif'; ctx.textAlign='right';
      ctx.fillText(yFmt(Math.round(v*10)/10), pad.left-6, y+3.5);
    }
  }

  // bars
  const n = labels.length;
  const groupW = horiz ? plotH/n : plotW/n;
  const barPad = groupW*0.18;
  const nds = datasets.length;

  if(stacked){
    labels.forEach((lbl,i)=>{
      let base = 0;
      datasets.forEach((ds,di)=>{
        const v = ds.data[i]||0;
        const color = Array.isArray(ds.backgroundColor)?ds.backgroundColor[di]||ds.backgroundColor[0]:ds.backgroundColor;
        ctx.fillStyle = color || '#005FFF';
        if(horiz){
          const y0 = pad.top + i*groupW + barPad;
          const bH = groupW - barPad*2;
          const x0 = toPixel(base);
          const bW = toPixel(base+v) - x0;
          ctx.beginPath(); ctx.rect(x0, y0, bW, bH, 3); ctx.fill();
        } else {
          const x0 = pad.left + i*groupW + barPad;
          const bW = groupW - barPad*2;
          const y0 = toPixel(base+v);
          const bH = toPixel(base) - y0;
          ctx.beginPath(); ctx.rect(x0, y0, bW, bH, 3); ctx.fill();
        }
        base += v;
      });
    });
  } else {
    const bW2 = (groupW - barPad*2) / nds;
    labels.forEach((lbl,i)=>{
      datasets.forEach((ds,di)=>{
        const v = ds.data[i]||0;
        const color = Array.isArray(ds.backgroundColor)?ds.backgroundColor[i]||ds.backgroundColor[0]:ds.backgroundColor;
        ctx.fillStyle = color || '#005FFF';
        if(horiz){
          const y0 = pad.top + i*groupW + barPad + di*bW2;
          const bH = bW2*0.9;
          const x0 = v>=0 ? zeroLine : toPixel(v);
          const bW = Math.abs(toPixel(v) - zeroLine);
          ctx.beginPath(); ctx.rect(x0, y0, bW, bH, 3); ctx.fill();
        } else {
          const x0 = pad.left + i*groupW + barPad + di*bW2;
          const bW = bW2*0.9;
          const y0 = v>=0 ? toPixel(v) : zeroLine;
          const bH = Math.abs(toPixel(v) - zeroLine);
          ctx.beginPath(); ctx.rect(x0, y0, bW, bH, 3); ctx.fill();
        }
      });
    });
  }

  // axis labels (category)
  ctx.fillStyle='rgba(74,81,120,0.9)'; ctx.font='10px Arial,sans-serif';
  labels.forEach((lbl,i)=>{
    const mid = (i+0.5)*groupW;
    if(horiz){
      ctx.textAlign='right'; ctx.textBaseline='middle';
      ctx.fillText(String(lbl), pad.left-6, pad.top+mid);
    } else {
      ctx.textAlign='center'; ctx.textBaseline='top';
      const txt = String(lbl);
      ctx.fillText(txt.length>12?txt.slice(0,11)+'…':txt, pad.left+mid, H-pad.bottom+4);
    }
  });

  // zero line
  ctx.strokeStyle='rgba(0,10,60,0.2)'; ctx.lineWidth=1;
  ctx.beginPath();
  if(horiz){ ctx.moveTo(zeroLine,pad.top); ctx.lineTo(zeroLine,pad.top+plotH); }
  else { ctx.moveTo(pad.left,zeroLine); ctx.lineTo(pad.left+plotW,zeroLine); }
  ctx.stroke();
};

// ── LINE ─────────────────────────────────────────────────────────────────────
Chart.prototype._drawLine = function(){
  const cfg = this.config;
  const opts = cfg.options||{};
  const datasets = cfg.data.datasets;
  const labels = cfg.data.labels;
  const ctx = setupCanvas(this.canvas);
  const W=this.canvas.width, H=this.canvas.height;
  const yFmt=(opts.scales&&opts.scales.y&&opts.scales.y.ticks&&opts.scales.y.ticks.callback)||(v=>v);
  const pad={top:16,right:20,bottom:36,left:52};
  const plotW=W-pad.left-pad.right, plotH=H-pad.top-pad.bottom;

  let allVals=[]; datasets.forEach(d=>d.data.filter(v=>v!=null).forEach(v=>allVals.push(v)));
  const minCfg=(opts.scales&&opts.scales.y&&opts.scales.y.min);
  const maxCfg=(opts.scales&&opts.scales.y&&opts.scales.y.max);
  const vMin=minCfg!=null?minCfg:Math.min(...allVals)*0.97;
  const vMax=maxCfg!=null?maxCfg:Math.max(...allVals)*1.03;
  const vRange=vMax-vMin||1;

  const n=labels.length;
  function px(i){ return pad.left + i/(n-1)*plotW; }
  function py(v){ return pad.top + plotH - (v-vMin)/vRange*plotH; }

  // grid
  ctx.strokeStyle='rgba(0,10,60,0.07)'; ctx.lineWidth=0.5;
  for(let i=0;i<=5;i++){
    const v=vMin+i/5*vRange;
    const y=py(v);
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(pad.left+plotW,y); ctx.stroke();
    ctx.fillStyle='rgba(74,81,120,0.85)'; ctx.font='10px Arial,sans-serif'; ctx.textAlign='right';
    ctx.fillText(yFmt(Math.round(v*10)/10),pad.left-6,y+3.5);
  }

  // x labels
  ctx.fillStyle='rgba(74,81,120,0.9)'; ctx.font='10px Arial,sans-serif'; ctx.textAlign='center';
  labels.forEach((l,i)=>ctx.fillText(String(l),px(i),H-pad.bottom+14));

  // datasets
  datasets.forEach(ds=>{
    const color=ds.borderColor||'#005FFF';
    const fill=ds.fill;
    const fillColor=ds.backgroundColor||colorAlpha(color,0.12);
    const tension=ds.tension||0;
    const pts=ds.data.map((v,i)=>v!=null?{x:px(i),y:py(v)}:null).filter(Boolean);
    if(pts.length<2) return;

    if(fill){
      ctx.beginPath();
      ctx.moveTo(pts[0].x,py(vMin));
      pts.forEach(p=>ctx.lineTo(p.x,p.y));
      ctx.lineTo(pts[pts.length-1].x,py(vMin));
      ctx.closePath();
      ctx.fillStyle=fillColor; ctx.fill();
    }

    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++){
      if(tension>0){
        const cp1x=pts[i-1].x+(pts[i].x-pts[i-1].x)*0.4;
        const cp1y=pts[i-1].y;
        const cp2x=pts[i].x-(pts[i].x-pts[i-1].x)*0.4;
        const cp2y=pts[i].y;
        ctx.bezierCurveTo(cp1x,cp1y,cp2x,cp2y,pts[i].x,pts[i].y);
      } else { ctx.lineTo(pts[i].x,pts[i].y); }
    }
    ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();

    // dots
    const dotColor=ds.pointBackgroundColor||color;
    const dotR=ds.pointRadius||4;
    pts.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,dotR,0,Math.PI*2);
      ctx.fillStyle=dotColor; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
    });
  });
};

// ── DOUGHNUT ─────────────────────────────────────────────────────────────────
Chart.prototype._drawDoughnut = function(){
  const cfg=this.config;
  const opts=cfg.options||{};
  const data=cfg.data.datasets[0].data;
  const colors=cfg.data.datasets[0].backgroundColor||[];
  const ctx=setupCanvas(this.canvas);
  const W=this.canvas.width, H=this.canvas.height;
  const cx=W/2, cy=H/2;
  const outerR=Math.min(W,H)*0.42;
  const cutout=parseFloat(opts.cutout)||60;
  const innerR=outerR*(cutout/100);
  const total=data.reduce((a,b)=>a+b,0);
  let angle=-Math.PI/2;
  const borderW=cfg.data.datasets[0].borderWidth||2;
  data.forEach((v,i)=>{
    const sweep=v/total*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx+innerR*Math.cos(angle),cy+innerR*Math.sin(angle));
    ctx.arc(cx,cy,outerR,angle,angle+sweep);
    ctx.arc(cx,cy,innerR,angle+sweep,angle,true);
    ctx.closePath();
    ctx.fillStyle=colors[i]||'#ccc'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=borderW; ctx.stroke();
    angle+=sweep;
  });
};

global.Chart = Chart;
window.Chart = Chart;
})();

// ─── CHART UTILITIES ─────────────────────────────────────────────────────────

const CHART_INSTANCES = {};

function destroyChart(id) {
  if (CHART_INSTANCES[id]) {
    CHART_INSTANCES[id].destroy();
    delete CHART_INSTANCES[id];
  }
}

function destroyAllCharts() {
  Object.keys(CHART_INSTANCES).forEach(id => destroyChart(id));
}

const C = {
  blue: '#005FFF',
  navy: '#000A3C',
  coral: '#D85A30',
  teal: '#1D9E75',
  amber: '#BA7517',
  purple: '#7F77DD',
  pink: '#D4537E',
  gray: '#888780',
  green: '#639922',
};

function buildBarChart(id, labels, datasets, opts = {}) {
  if (typeof Chart === 'undefined') { console.error('Chart not loaded'); return; }
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  CHART_INSTANCES[id] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: {
          beginAtZero: opts.beginAtZero !== false,
          min: opts.yMin,
          ticks: { callback: opts.yFmt || (v => v) },
          grid: { color: 'rgba(0,10,60,0.06)' },
        },
        x: {
          grid: { display: false },
          ticks: { font: { size: 11 }, color: '#4a5178' },
        },
      },
      ...opts.extra,
    },
  });
}

function buildHBarChart(id, labels, data, color, opts = {}) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  CHART_INSTANCES[id] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: opts.label || '',
        data,
        backgroundColor: Array.isArray(color) ? color : data.map((_, i) => color + (i === 0 ? 'ff' : 'cc')),
        borderRadius: 4,
      }],
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { callback: opts.xFmt || (v => v), font: { size: 11 } }, grid: { color: 'rgba(0,10,60,0.06)' } },
        y: { ticks: { font: { size: 11 }, color: '#4a5178' }, grid: { display: false } },
      },
    },
  });
}

function buildDoughnutChart(id, labels, data, colors) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  CHART_INSTANCES[id] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      cutout: '60%',
    },
  });
}

function buildLineChart(id, labels, datasets, opts = {}) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  CHART_INSTANCES[id] = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: {
          min: opts.yMin,
          max: opts.yMax,
          ticks: { callback: opts.yFmt || (v => v), font: { size: 11 } },
          grid: { color: 'rgba(0,10,60,0.06)' },
        },
        x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#4a5178' } },
      },
    },
  });
}

function buildStackedBarChart(id, labels, datasets, opts = {}) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  CHART_INSTANCES[id] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { font: { size: 11 }, color: '#4a5178' } },
        y: { stacked: true, ticks: { callback: opts.yFmt || (v => v), font: { size: 11 } }, grid: { color: 'rgba(0,10,60,0.06)' } },
      },
    },
  });
}

function buildRangeBar(id, labels, mins, maxes, color, opts = {}) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  CHART_INSTANCES[id] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Min', data: mins, backgroundColor: color + '44', borderRadius: 4, stack: 'r' },
        { label: 'Range', data: maxes.map((v, i) => v - mins[i]), backgroundColor: color + 'cc', borderRadius: 0, stack: 'r' },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { stacked: true, ticks: { callback: opts.yFmt || (v => v), font: { size: 11 } }, grid: { color: 'rgba(0,10,60,0.06)' } },
        x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#4a5178' } },
      },
    },
  });
}

function legendHtml(labels, colors) {
  return labels.map((l, i) => `
    <span class="legend-item">
      <span class="legend-dot" style="background:${colors[i]}"></span>${l}
    </span>`).join('');
}

// ─── APP CONTROLLER ──────────────────────────────────────────────────────────

let currentPage = 'home';
let currentSub = null;

const PAGE_META = {
  home:    { title: 'Homepage',       breadcrumb: 'Resumen del mercado publicitario español' },
  tv:      { title: 'TV Lineal',      breadcrumb: 'Inversión, audiencias y CPM · TV convencional' },
  ctv:     { title: 'CTV',            breadcrumb: 'Connected TV · inversión y plataformas' },
  digital: { title: 'Digital',        breadcrumb: 'Search, Social, Display, Vídeo online' },
  radio:   { title: 'Radio & Audio',  breadcrumb: 'Radio convencional y audio digital' },
};

const TIPO_LABELS = {
  SVOD: 'SVOD con publicidad',
  AVOD: 'AVOD',
  BVOD: 'BVOD',
  FAST: 'FAST',
  PVOD: 'PVOD / Pay TV VOD',
};

function navigate(page) {
  destroyAllCharts();
  currentPage = page;
  currentSub = null;

  // Nav items active state
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });

  // CTV subnav visibility
  const subnav = document.getElementById('ctv-subnav');
  subnav.classList.toggle('open', page === 'ctv');

  // Clear sub-item active
  document.querySelectorAll('.nav-sub-item').forEach(el => el.classList.remove('active'));

  // Update header
  const meta = PAGE_META[page] || { title: page, breadcrumb: '' };
  document.getElementById('page-title').textContent = meta.title;
  document.getElementById('page-breadcrumb').textContent = meta.breadcrumb;

  // Render
  switch (page) {
    case 'home':    renderHome(); break;
    case 'tv':      renderTV(); break;
    case 'ctv':     renderCTV(null); break;
    case 'digital': renderDigital(); break;
    case 'radio':   renderRadio(); break;
  }
}

function navigateSub(page, sub) {
  destroyAllCharts();
  currentPage = page;
  currentSub = sub;

  // Parent nav active
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });

  // Subnav open
  const subnav = document.getElementById('ctv-subnav');
  subnav.classList.add('open');

  // Sub item active
  document.querySelectorAll('.nav-sub-item').forEach(el => {
    el.classList.toggle('active', el.dataset.sub === sub);
  });

  const tipo = sub.toUpperCase();
  const tipoLabel = TIPO_LABELS[tipo] || tipo;

  document.getElementById('page-title').textContent = tipo;
  document.getElementById('page-breadcrumb').textContent = `${tipoLabel} · plataformas y métricas España 2024`;

  renderCTVTipo(tipo);
}

function updateTimestamp() {
  const now = DATA.lastUpdate || new Date();
  const timeStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  const dateStr = now.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
  const full = `${dateStr} · ${timeStr}`;
  document.getElementById('last-update-text').textContent = full;
  document.getElementById('sidebar-last-update').textContent = full;
}

function refreshData() {
  const btn = document.getElementById('refresh-btn');
  const icon = document.getElementById('refresh-icon');
  btn.classList.add('loading');
  icon.classList.add('spinning');

  setTimeout(() => {
    simulateDataRefresh();
    updateTimestamp();

    // Re-render current page
    destroyAllCharts();
    if (currentSub) {
      navigateSub(currentPage, currentSub);
    } else {
      navigate(currentPage);
    }

    btn.classList.remove('loading');
    icon.classList.remove('spinning');
  }, 900);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  try {
    updateTimestamp();
    navigate('home');
  } catch(e) {
    document.getElementById('content').innerHTML = '<div style="padding:40px;color:#000a3c"><h2>Error al cargar</h2><pre style="font-size:12px;margin-top:10px">'+e.message+'</pre></div>';
    console.error('Init error:', e);
  }
});

</script>
